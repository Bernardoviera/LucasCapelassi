<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas Capelassi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0c0c0c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-bg {
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(37,99,235,0.15) 0%, transparent 70%),
        #0c0c0c;
    }

    .avatar-ring {
      padding: 3px;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.15), 0 8px 32px rgba(59,130,246,0.25);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      border: 1px solid rgba(59,130,246,0.2);
      background: #161616;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59,130,246,0.07), transparent);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .link-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 8px 28px rgba(59,130,246,0.2), 0 2px 8px rgba(0,0,0,0.4);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-btn-primary {
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      border-color: transparent;
      box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    }

    .link-btn-primary:hover {
      box-shadow: 0 8px 32px rgba(59,130,246,0.55);
      border-color: transparent;
    }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }

    .link-btn-primary .link-icon {
      background: rgba(255,255,255,0.15);
    }

    .arrow {
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .link-btn:hover .arrow {
      color: rgba(255,255,255,0.8);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .line-1 { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.05s both; }
    .line-2 { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.15s both; }
    .line-3 { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.25s both; }
    .line-4 { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.35s both; }
    .line-5 { animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) 0.45s both; }
  </style>
</head>
<body class="page-bg px-4 py-12">

  <div class="w-full max-w-sm mx-auto flex flex-col items-center gap-6">

    <!-- Avatar -->
    <div class="avatar-ring line-1">
      <img src="lucas.jpg" alt="Lucas Capelassi"
           class="w-24 h-24 rounded-full object-cover object-center block" />
    </div>

    <!-- Nome e bio -->
    <div class="text-center line-2">
      <h1 class="text-xl font-black text-white mb-1">Lucas Capelassi</h1>
      <p class="text-gray-500 text-sm">Especialista em restauração de faróis · Fundador da S.O.S Faróis &amp; Latarias</p>
    </div>

    <!-- Separador -->
    <div class="w-12 h-px bg-blue-600 opacity-60 line-3"></div>

    <!-- Links -->
    <div class="w-full flex flex-col gap-3 line-4">

      <!-- Curso -->
      <a href="/curso.html" class="link-btn link-btn-primary">
        <div class="link-icon">🎓</div>
        <div class="flex-1">
          <div class="text-white font-bold text-sm leading-tight">Curso Lente Zerada</div>
          <div class="text-blue-200 text-xs font-normal mt-0.5">Aprenda a restaurar faróis e cobrar por isso</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <!-- Loja -->
      <a href="https://lojadofaroleiro.com/" target="_blank" rel="noopener" class="link-btn">
        <div class="link-icon">🛒</div>
        <div class="flex-1">
          <div class="text-white font-bold text-sm leading-tight">Loja do Faroleiro</div>
          <div class="text-gray-500 text-xs font-normal mt-0.5">Produtos para restauração de faróis</div>
        </div>
        <span class="arrow">→</span>
      </a>

    </div>

    <!-- Rodapé -->
    <p class="text-gray-700 text-xs line-5">© 2026 Lucas Capelassi</p>

  </div>

</body>
</html>
